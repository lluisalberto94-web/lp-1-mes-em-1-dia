name: Apply LP refactor
on:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage LP refactor package'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download refactor package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-80f0-81f5-8708-963f91b5aa15/raw?se=2026-09-21T17%3A33%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=86981e4f-fd30-5843-88b0-8bacca6bcf88&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T16%3A38%3A41Z&ske=2026-09-22T16%3A38%3A41Z&sks=b&skv=2026-02-06&sig=opOlGCd9EwfaBs6tbBeECAEci8fmH3LTDPr4ALveQy8%3D' -o /tmp/lp-refactor.zip
          unzip -o /tmp/lp-refactor.zip -d .
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html obrigado.html assets/lauro-renata-original.webp assets/samuel-original.webp
          git commit -m "Refatora narrativa e hierarquia da LP"
          git push
