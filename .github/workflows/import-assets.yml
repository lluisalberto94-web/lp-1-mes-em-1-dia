name: Import LP assets
on:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  import-assets:
    if: github.event.head_commit.message == 'Stage temporary asset import workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-fb78-820e-be71-21e1fed7e2d9/raw?se=2026-09-21T15%3A59%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=d87c4c88-5f91-55e1-8734-ef128ea848f7&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T11%3A03%3A47Z&ske=2026-09-22T11%3A03%3A47Z&sks=b&skv=2026-02-06&sig=6ofigoADzy8z7kHbwHhLceZjns8KabKzcJeLnAbLQRI%3D' -o assets/hero-oficial.png
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f55c-820e-b068-06d931de62cd/raw?se=2026-09-21T15%3A59%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=da501fe9-d2e9-5c7a-9227-9d9a3e12d915&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T11%3A03%3A31Z&ske=2026-09-22T11%3A03%3A31Z&sks=b&skv=2026-02-06&sig=zYLPYeJY71wTsL2g53ZBybY%2BmzXX/2S054zk74nsbzg%3D' -o assets/logo-oficial.png
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7808-820e-8f38-6083ede901c9/raw?se=2026-09-21T15%3A59%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=5a91776e-8172-5d04-984d-396ba65f42d6&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T12%3A04%3A44Z&ske=2026-09-22T12%3A04%3A44Z&sks=b&skv=2026-02-06&sig=SEGG0rjnIjWKgkWbE6OHJha1Ota7aMMCvWoZr8kjUq0%3D' -o assets/resultado-real-1.png
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1194-820e-bb37-e853f3d40b75/raw?se=2026-09-21T15%3A59%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=a55c07dc-f53a-5e9e-9d89-740475c20749&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T11%3A14%3A32Z&ske=2026-09-22T11%3A14%3A32Z&sks=b&skv=2026-02-06&sig=j0c%2BSsdvuQhYYeH3SU0jXHXZLM%2BeeEfTO1i5M1K270M%3D' -o assets/resultado-real-2.png
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4368-820e-b846-3bdbb7746cdf/raw?se=2026-09-21T15%3A59%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=1a4282e4-d91c-5e73-9098-ffc860e328a1&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T12%3A39%3A56Z&ske=2026-09-22T12%3A39%3A56Z&sks=b&skv=2026-02-06&sig=REMwrj%2BJPF6qF1hIq6Q%2BZtUI7JZfQ8FD3gOznfmLva0%3D' -o assets/resultado-real-3.png
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2b28-820e-acd3-c679f38c6bad/raw?se=2026-09-21T15%3A59%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=6907dbf3-ba69-517c-ae22-740341f26960&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T13%3A38%3A26Z&ske=2026-09-22T13%3A38%3A26Z&sks=b&skv=2026-02-06&sig=kYAJNo1gxdfTcNPu0yi7vdQhEHcTJi9iBNyTpFcpHw4%3D' -o assets/resultado-real-4.png
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-30a0-820e-8b5e-03197a08702b/raw?se=2026-09-21T16%3A00%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=fc8cd93a-1255-51b3-af43-dc19da1c5421&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T11%3A50%3A18Z&ske=2026-09-22T11%3A50%3A18Z&sks=b&skv=2026-02-06&sig=8%2Bmf7NdR7YjR4gFGtonq8P4vwMz45kM7B7cYga68TG4%3D' -o assets/resultado-real-5.png
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-oficial.png assets/logo-oficial.png assets/resultado-real-*.png
          git commit -m "Import official hero, logo and social proof assets"
          git push
